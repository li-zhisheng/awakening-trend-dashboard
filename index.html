<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#101417">
  <link rel="icon" href="data:,">
  <title>强势追涨 · 主策略看板</title>
  <link rel="stylesheet" href="styles.css?v=20261102-market">
  <script src="echarts.min.js"></script>
  <script src="app.js?v=20261102-market" defer></script>
</head>
<body>
  <header class="site-header">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true">强</span>
      <div>
        <div class="eyebrow">AWAKENING / PRIMARY STRATEGY</div>
        <h1>强势追涨</h1>
      </div>
    </div>
    <div class="header-status">
      <span id="strategy-state" class="status">读取中</span>
      <time id="generated-at">--</time>
      <button id="refresh" type="button" title="刷新数据" aria-label="刷新数据">↻</button>
    </div>
  </header>

  <nav class="view-tabs" aria-label="主策略视图">
    <button class="active" data-view="account" type="button">模拟账户</button>
    <button data-view="candidates" type="button">候选记录</button>
  </nav>

  <main>
    <section id="view-account" class="view active">
      <section class="capital-control">
        <label for="initial-capital">初始本金</label>
        <div class="capital-input">
          <span>¥</span>
          <input id="initial-capital" type="number" min="1000" step="1000"
                 inputmode="decimal" value="50000">
        </div>
        <button id="capital-reset" type="button" title="恢复冻结本金"
                aria-label="恢复冻结本金">↺</button>
        <span id="capital-contract">--</span>
      </section>
      <div id="account-kpis" class="kpi-grid"></div>

      <section class="status-band">
        <div><span>模拟区间</span><strong id="simulation-period">--</strong></div>
        <div><span>冻结版本</span><strong id="frozen-version">--</strong></div>
        <div><span>执行时点</span><strong id="execution-time">--</strong></div>
        <div><span>交易记录</span><strong id="trade-count">--</strong></div>
      </section>

      <div class="split-grid">
        <section class="panel">
          <div class="panel-head">
            <div><h2>年度模拟资金</h2><p>从2024年起连续复合</p></div>
          </div>
          <div class="table-wrap"><table id="annual-table"></table></div>
        </section>
        <section class="panel">
          <div class="panel-head">
            <div><h2>冻结规则</h2><p>唯一现役主策略</p></div>
          </div>
          <dl id="rule-list" class="rule-list"></dl>
        </section>
      </div>

      <section class="panel">
        <div class="panel-head">
          <div><h2>完整性校验</h2><p>协议、结果与候选轴</p></div>
          <span id="integrity-state" class="status">--</span>
        </div>
        <div id="integrity-grid" class="hash-grid"></div>
      </section>
    </section>

    <section id="view-candidates" class="view">
      <div id="candidate-kpis" class="kpi-grid"></div>
      <div class="toolbar">
        <label>年份<select id="candidate-year">
          <option value="all">全部</option>
          <option value="2024">2024</option>
          <option value="2025">2025</option>
          <option value="2026">2026</option>
        </select></label>
        <label>状态<select id="candidate-status">
          <option value="all">全部候选</option>
          <option value="primary_trade">主账户交易</option>
          <option value="observation_candidate">观察候选</option>
          <option value="entry_unfillable">成交约束未通过</option>
        </select></label>
        <label>结果<select id="candidate-result">
          <option value="all">全部结果</option>
          <option value="profit">盈利</option>
          <option value="loss">亏损</option>
        </select></label>
        <label>搜索<input id="candidate-search" type="search" placeholder="代码或名称"></label>
        <span id="candidate-count" class="toolbar-count">--</span>
      </div>
      <section class="panel">
        <div class="panel-head">
          <div><h2>每日 Top2 候选</h2><p>09:36确认，09:37执行</p></div>
          <span id="sync-state" class="status">--</span>
        </div>
        <div class="table-wrap candidate-table-wrap">
          <table id="candidate-table"></table>
        </div>
      </section>
    </section>
  </main>

  <dialog id="stock-dialog">
    <div class="dialog-head">
      <div>
        <h2 id="stock-dialog-title">候选详情</h2>
        <p id="stock-dialog-meta">--</p>
      </div>
      <button id="stock-dialog-close" type="button"
              title="关闭" aria-label="关闭">×</button>
    </div>
    <div class="market-toolbar">
      <div class="segmented" role="tablist" aria-label="行情周期">
        <button id="stock-daily-tab" class="active" type="button"
                role="tab" aria-selected="true">日K</button>
        <button id="stock-minute-tab" type="button"
                role="tab" aria-selected="false">分时</button>
      </div>
      <span id="stock-market-status">读取中</span>
    </div>
    <div id="stock-detail-chart" class="stock-market-chart"></div>
    <div class="detail-strip">
      <div><span>信号日</span><strong id="detail-signal-day">--</strong></div>
      <div><span>09:37入场</span><strong id="detail-entry">--</strong></div>
      <div><span>退出</span><strong id="detail-exit">--</strong></div>
      <div><span>净收益</span><strong id="detail-return">--</strong></div>
    </div>
  </dialog>
</body>
</html>
